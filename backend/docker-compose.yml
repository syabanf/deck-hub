services:
  db:
    image: postgres:16-alpine
    container_name: wit-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-wit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wit}
      POSTGRES_DB: ${DB_NAME:-wit}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - wit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wit} -d ${DB_NAME:-wit}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional lightweight DB UI at http://localhost:8081 (system: PostgreSQL,
  # server: db, user/password/db per the env above).
  adminer:
    image: adminer:latest
    container_name: wit-adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  wit_pgdata:
