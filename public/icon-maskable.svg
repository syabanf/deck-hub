<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable: full-bleed background (the OS applies its own mask) with the
       wordmark kept inside the 80% safe zone so nothing gets clipped. -->
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e50914"/>
      <stop offset="1" stop-color="#8c0009"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="300"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="bold" font-size="128" letter-spacing="-4"
        text-anchor="middle" fill="#ffffff">WIT</text>
</svg>
