<!-- Browser tab mark.
     The wordmark is 3.2:1. Fitted into 16 or 32 pixels it becomes an
     illegible smear, so the tab gets the one part of the logo that survives
     at that size: the dot, in the brand red read off the logo pack. The full
     wordmark is on the larger icons, where it reads. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="13" fill="#0b0b0f"/>
  <circle cx="32" cy="32" r="14.7" fill="#ED1C24"/>
</svg>
