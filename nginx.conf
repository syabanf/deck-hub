server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above the app's own 25 MB cap, not equal to it: multipart framing adds
        # a few hundred bytes, so a file exactly at the limit would be refused
        # by nginx with a bare 413 instead of the API's explained error.
        client_max_body_size 30m;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # pdf.js ships its worker as .mjs, and nginx's mime.types has no entry for
    # that extension — so it went out as application/octet-stream. Browsers
    # refuse a module script with that type, pdf.js fell back to a "fake
    # worker", and reading a PDF failed before the upload ever started. That is
    # why uploading a PDF worked locally (Vite serves the right type) and not
    # here.
    #
    # A regex location wins over the /assets/ prefix above, so the caching
    # headers have to be repeated here rather than inherited.
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
